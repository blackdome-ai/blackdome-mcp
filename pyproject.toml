[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackdome-mcp"
version = "0.3.1"
description = "BlackDome MCP Server — AI agent access to live honeypot threat intelligence, attacker IPs, IOCs, and credential intel."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "BlackDome", email = "support@blackdome.ai" }]
keywords = ["mcp", "threat-intel", "blackdome", "security", "iocs", "honeypot", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
blackdome-mcp = "blackdome_mcp.server:main"
blackdome-mcp-http = "blackdome_mcp.http_server:main"

[project.urls]
Homepage = "https://blackdome.ai"
Documentation = "https://blackdome.ai/docs/mcp"
Repository = "https://github.com/blackdome-ai/blackdome-mcp"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
